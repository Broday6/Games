# Builds the downloadable desktop game (Windows installer + portable exe, macOS dmg, Linux AppImage)
# and attaches them to a GitHub Release. Runs when a tag like v1.0.0 is pushed, or manually from the Actions tab.
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build game bundle and desktop packages
        working-directory: desktop
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: driftwood-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Also publish the single-file browser build
        run: |
          cd driftwood && node build.js && cp dist/driftwood.html ../out/Driftwood-browser.html
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_TYPE}" ; if [ "$TAG" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="latest"; fi
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" out/* --clobber; else gh release create "$TAG" out/* --title "Driftwood $TAG" --notes "Download: **Driftwood-Setup-*.exe** (Windows installer) or **Driftwood-Portable-*.exe** (no install) · **.dmg** (macOS) · **.AppImage** (Linux) · **Driftwood-browser.html** (runs in any browser). Multiplayer: host a game, share the 5-letter room code." ; fi
