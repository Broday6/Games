appId: com.broday6.driftwood
productName: Driftwood
directories:
  output: dist
files:
  - main.js
  - game.html
  - package.json
  - icon.*
win:
  target:
    - nsis
    - portable
  icon: icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: Driftwood-Setup-${version}.${ext}
portable:
  artifactName: Driftwood-Portable-${version}.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  icon: icon.icns
  artifactName: Driftwood-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Game
  icon: icon.png
  artifactName: Driftwood-${version}-linux.${ext}
publish: null
