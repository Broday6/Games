<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Schedule, time clock, expenses and invoices for contracting work, plus a smart gym log. Works offline.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="top-in"><div class="top-titles"><span id="page-eyebrow">Daybook</span><h1 id="page-title">Today</h1></div><button type="button" id="ask-btn" class="btn sm ask-top" data-act="ask" hidden>Ask Claude</button></div></header>
<main id="main" aria-live="polite"></main>
<div id="restbar" hidden role="timer" aria-label="Rest timer">
  <div class="rest-fill"><i></i></div>
  <span class="eyebrow">Rest</span><strong data-rest>2:00</strong><span class="grow"></span>
  <button type="button" data-act="rest-adj" data-d="-15" aria-label="15 seconds less">−15</button>
  <button type="button" data-act="rest-adj" data-d="15" aria-label="15 seconds more">+15</button>
  <button type="button" data-act="rest-skip">Skip</button>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div id="toasts"></div>
<div id="print-root"></div>
<noscript><p style="padding:16px">Daybook needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
